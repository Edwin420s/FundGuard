app = "omega-fundguard"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.backend"

[env]
ENABLE_TESTNET = "true"
ENABLE_MAINNET = "false"
LOG_LEVEL = "INFO"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

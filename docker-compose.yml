services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundguard
      POSTGRES_USER: fundguard
      POSTGRES_PASSWORD: fundguard_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundguard -d fundguard"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - fundguard-db:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://fundguard:fundguard_dev_only@db:5432/fundguard
      CORS_ORIGINS: http://localhost:5173
      SETTLEMENT_MODE: simulated
      ALLOW_STELLAR_TESTNET: "false"
      ALLOW_STELLAR_MAINNET: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  fundguard-db:
